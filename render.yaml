services:
  - type: web
    name: deslizados-labsico
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m slipform.server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SLIPFORM_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: deslizados-labsico-db
          property: connectionString

databases:
  - name: deslizados-labsico-db
    databaseName: deslizados_labsico
    user: deslizados_labsico
    region: oregon
    plan: basic-256mb
